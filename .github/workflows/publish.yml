name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORDS_WASM_VERSION: v0.4
      WORDS_WEB_ARCHIVE_SHA256: 606abf015aa97957a67cb383dac2f5ef76c087ddaa873345647eae867295f930
      WORDS_SEARCH_SHA256: 0f69f7d8e7e8510152fe5b46ad5eff080dda7b37a49d3043e2dbf076695034d5
      WORDS_DATASET_ID: sha256:99f23fa3d2a962d2e325b192f064454046c78954af0fb20b4856b0624a288d05
      CITATIONS_RELEASE_REPOSITORY: Fabio3rs/Dicionarios-Latim
      CITATIONS_RELEASE_TAG: data-v2-citations-2026-08-30
      CITATIONS_WEB_ARCHIVE_SHA256: 156ccc64ae1c788248bb934f44d9a8be98696c3c1a0884fbcbbeb1df3596ac76
      CITATIONS_MANIFEST_SHA256: d0b3bd1228d2aa8cbb0640724a561596cc362ffa75b1b5fb3013f05a2ca0e50a
      CITATIONS_DATABASE_SHA256: 33bc586b4708484ec92273748be8afaff09ee18f5ae55cc7527b61232fdf8446
      CITATIONS_INDEX_SHA256: fef9c52c3c59481c3fa0758f5b00aaee0672f7a597ca4fa3f733974b388579e9
      CITATIONS_SHARD_COUNT: 59
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download WordsWASM search runtime
        run: |
          set -euo pipefail

          release_base="https://github.com/Fabio3rs/WordsWASM/releases/download/${WORDS_WASM_VERSION}"
          release_dir="${RUNNER_TEMP}/words-wasm-${WORDS_WASM_VERSION}"
          archive="${release_dir}/words-web-${WORDS_WASM_VERSION}.tar.gz"
          source_dir="${release_dir}/words-web"
          target_dir="./public/words"

          mkdir -p "${release_dir}" "${target_dir}"
          curl --fail --location --retry 3 --output "${archive}" \
            "${release_base}/words-web-${WORDS_WASM_VERSION}.tar.gz"
          printf '%s  %s\n' "${WORDS_WEB_ARCHIVE_SHA256}" "${archive}" \
            | sha256sum --check --status

          tar -xzf "${archive}" -C "${release_dir}" \
            words-web/dataset-manifest.json \
            words-web/manifest.json \
            words-web/words-engine.mjs \
            words-web/words-search.wwdb \
            words-web/words_wasm.mjs \
            words-web/words_wasm.wasm
          for asset in \
            dataset-manifest.json \
            manifest.json \
            words-engine.mjs \
            words-search.wwdb \
            words_wasm.mjs \
            words_wasm.wasm
          do
            test -s "${source_dir}/${asset}"
            install -m 0644 "${source_dir}/${asset}" "${target_dir}/${asset}"
          done

          # The site owns its definitions. Never publish the full WORDS database.
          rm -f \
            "${target_dir}/words-full.wwdb" \
            "${target_dir}/words-full.wwdb.br" \
            "${target_dir}/words-full.wwdb.gz"
          printf '%s  %s\n' "${WORDS_SEARCH_SHA256}" "${target_dir}/words-search.wwdb" \
            | sha256sum --check --status

          node --input-type=module -e '
            import {readFile, writeFile} from "node:fs/promises";
            const manifestPath = "./public/words/manifest.json";
            const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
            const expectedDataset = process.env.WORDS_DATASET_ID;
            if (manifest.schema !== "whitakers-words.web-assets" ||
                manifest.schemaVersion !== 1 ||
                manifest.datasetId !== expectedDataset ||
                manifest.entrypoint !== "words-engine.mjs" ||
                manifest.databases?.search?.file !== "words-search.wwdb" ||
                manifest.databases?.search?.provides?.includes("search") !== true) {
              throw new Error(`WordsWASM ${process.env.WORDS_WASM_VERSION} manifest does not match the expected search runtime`);
            }
            const deployedFiles = new Set([
              "dataset-manifest.json",
              "words-engine.mjs",
              "words-search.wwdb",
              "words_wasm.mjs",
              "words_wasm.wasm",
            ]);
            manifest.databases = {search: manifest.databases.search};
            manifest.files = Object.fromEntries(
              Object.entries(manifest.files).filter(([name]) => deployedFiles.has(name)),
            );
            await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          '
          test -s "${target_dir}/analysis-worker.mjs"
          test ! -e "${target_dir}/words-full.wwdb"

      - name: Download Faria v2 public citations
        run: |
          set -euo pipefail

          release_base="https://github.com/${CITATIONS_RELEASE_REPOSITORY}/releases/download/${CITATIONS_RELEASE_TAG}"
          release_dir="${RUNNER_TEMP}/faria-v2-citations-${CITATIONS_RELEASE_TAG}"
          archive="${release_dir}/faria-v2-citations-web.tar.gz"
          manifest="${release_dir}/faria-v2-citations-manifest.json"
          target_dir="./public"

          mkdir -p "${release_dir}" "${target_dir}/data/faria"
          test ! -e "${target_dir}/data/faria/citations.json"
          test ! -e "${target_dir}/data/faria/citations"

          curl --fail --location --retry 3 --output "${archive}" \
            "${release_base}/faria-v2-citations-web.tar.gz"
          curl --fail --location --retry 3 --output "${manifest}" \
            "${release_base}/faria-v2-citations-manifest.json"
          printf '%s  %s\n' "${CITATIONS_WEB_ARCHIVE_SHA256}" "${archive}" \
            | sha256sum --check --status
          printf '%s  %s\n' "${CITATIONS_MANIFEST_SHA256}" "${manifest}" \
            | sha256sum --check --status

          archive_entries="$(tar -tzf "${archive}" | wc -l)"
          expected_entries="$((CITATIONS_SHARD_COUNT + 1))"
          test "${archive_entries}" -eq "${expected_entries}"
          test "$(tar -tzf "${archive}" | grep -Ec '^data/faria/citations/faria-block-[0-9]{5}\.json$')" \
            -eq "${CITATIONS_SHARD_COUNT}"
          if tar -tzf "${archive}" \
            | grep -Ev '^(data/faria/citations\.json|data/faria/citations/faria-block-[0-9]{5}\.json)$'
          then
            echo "Citation archive contains an unexpected path" >&2
            exit 1
          fi

          tar -xzf "${archive}" -C "${target_dir}"
          printf '%s  %s\n' \
            "${CITATIONS_INDEX_SHA256}" \
            "${target_dir}/data/faria/citations.json" \
            | sha256sum --check --status

          CITATIONS_MANIFEST_PATH="${manifest}" \
          CITATIONS_INDEX_PATH="${target_dir}/data/faria/citations.json" \
          CITATIONS_SHARDS_DIR="${target_dir}/data/faria/citations" \
          node --input-type=module -e '
            import {access, readFile} from "node:fs/promises";
            import {join} from "node:path";

            const manifest = JSON.parse(
              await readFile(process.env.CITATIONS_MANIFEST_PATH, "utf8"),
            );
            const index = JSON.parse(
              await readFile(process.env.CITATIONS_INDEX_PATH, "utf8"),
            );
            const expectedShards = Number(process.env.CITATIONS_SHARD_COUNT);

            if (manifest.format !== "faria-v2-citations-release-1" ||
                manifest.release_tag !== process.env.CITATIONS_RELEASE_TAG ||
                manifest.artifacts?.["faria-v2-citations-web.tar.gz"]?.sha256 !== process.env.CITATIONS_WEB_ARCHIVE_SHA256 ||
                manifest.artifacts?.["faria-v2-citations.sqlite"]?.sha256 !== process.env.CITATIONS_DATABASE_SHA256 ||
                manifest.inputs?.citation_index_sha256 !== process.env.CITATIONS_INDEX_SHA256 ||
                manifest.inputs?.citation_shards !== expectedShards ||
                manifest.contracts?.web_archive_contains_sqlite !== false ||
                manifest.contracts?.web_archive_contains_v3_lexical_content !== false) {
              throw new Error("Faria v2 citation release manifest does not match the pinned publication contract");
            }
            if (index.format !== "faria-v2-public-citations-2" ||
                index.sharded !== true ||
                index.shard_path_template !== "citations/{block_file}" ||
                Object.keys(index.entries ?? {}).length !== 0 ||
                index.shards?.length !== expectedShards ||
                index.provenance?.citations_database_sha256 !== process.env.CITATIONS_DATABASE_SHA256 ||
                index.provenance?.publishes_v3_lexical_content !== false) {
              throw new Error("Faria v2 citation index does not match the pinned publication contract");
            }
            for (const shard of index.shards) {
              if (!/^faria-block-[0-9]{5}\.json$/.test(shard)) {
                throw new Error(`Invalid citation shard name: ${shard}`);
              }
              await access(join(process.env.CITATIONS_SHARDS_DIR, shard));
            }
          '

      - name: Build Pagefind index
        run: npm run search:index

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
